[workspace]
resolver = "3"
# Cargo rejects a member glob that matches nothing, so `plugins/*` is added here when its first crate lands.
members = ["kit/*", "crates/*", "apps/*", "xtask"]
# Fixture workspaces that the xtask gates run against. They are separate workspaces on purpose.
exclude = ["xtask/fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Bodo Kit
bodo-kit-audio = { path = "kit/bodo-kit-audio" }
bodo-kit-core = { path = "kit/bodo-kit-core" }
bodo-kit-device = { path = "kit/bodo-kit-device" }
bodo-kit-dsp = { path = "kit/bodo-kit-dsp" }
bodo-kit-graph = { path = "kit/bodo-kit-graph" }
bodo-kit-macros = { path = "kit/bodo-kit-macros" }
bodo-kit-midi = { path = "kit/bodo-kit-midi" }
bodo-kit-music = { path = "kit/bodo-kit-music" }
bodo-kit-ui = { path = "kit/bodo-kit-ui" }

# Bodo DAW
bodo-control = { path = "crates/bodo-control" }
bodo-engine = { path = "crates/bodo-engine" }
bodo-io = { path = "crates/bodo-io" }
bodo-mcp = { path = "crates/bodo-mcp" }
bodo-mix = { path = "crates/bodo-mix" }
bodo-model = { path = "crates/bodo-model" }
bodo-ui = { path = "crates/bodo-ui" }

# Real-time
atomic_refcell = "0.1.14"
crossbeam-queue = "0.3.14"
rtrb = "0.4.0"
audio_thread_priority = { version = "0.38.0", default-features = false }
assert_no_alloc = "1.1.2"
no_denormals = "0.3.0"
rtsan-standalone = "0.3.0"

# Audio devices
cpal = "0.18.2"
wasapi = "0.26.0"

# Audio files
audioadapter-buffers = "5.1.0"
hound = "3.5.1"
rubato = "5.0.1"
symphonia = { version = "0.6.1", features = ["aac", "aiff", "alac", "isomp4", "mp3"] }

# MIDI
midly = { version = "0.5.3", default-features = false, features = ["std"] }

# GUI. No default features: libraries draw with the fonts the app installs; apps and tests turn on `default_fonts`.
egui = { version = "0.36.2", default-features = false }
eframe = { version = "0.36.2", default-features = false }
# Shared egui components of the owner's apps (ADR 0001): icon buttons, resize handles, tabs. Pinned by commit.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e9546e191dd62f2bc1d61eca45dbdc2f1b3c1d8e" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"

# Data, errors and logging
blake3 = "1.8.7"
imbl = { version = "7.0.2", features = ["serde"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
ulid = "3.0.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }

# Async and agents: L8 crates and apps only
rmcp = { version = "3.5.1", default-features = false }
tokio = { version = "1.53.2", default-features = false }

# Platform services
base64 = "0.23.1"
directories = "6.0.0"
getrandom = "0.4.3"

# Apps and tooling
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
cargo_metadata = "0.23.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "visit", "parsing"] }
toml = "1.1.8"

# Testing
egui_kittest = "0.36.2"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny" # non-FFI crates also declare #![forbid(unsafe_code)]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.dev.package."*"]
# Keep dependencies reasonably fast in debug builds; tests run DSP and property loops.
opt-level = 1
