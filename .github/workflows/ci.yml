name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # cpal's ALSA backend needs the ALSA headers on Linux. The interface snapshots need a GPU adapter: lavapipe
      # (software Vulkan) on Linux; Windows has WARP built in and macOS runners have Metal.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mesa-vulkan-drivers
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
      # Snapshot tests that fail leave their pictures next to the baselines: keep them to see the difference, or to
      # add a baseline for this platform in tests/snapshots/<os>/.
      - name: Upload failing snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-snapshots-${{ matrix.os }}
          path: |
            **/tests/snapshots/**/*.new.png
            **/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore

  rtsan:
    # RealtimeSanitizer aborts on any allocation, lock or blocking call inside #[rt_safe] code (ADR 0014).
    name: RealtimeSanitizer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RTSAN_ENABLE: "1"
    steps:
      - uses: actions/checkout@v7
      # cpal's ALSA backend needs the ALSA headers on Linux, and the interface snapshots need lavapipe.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mesa-vulkan-drivers
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  asio:
    # ASIO support for audio interfaces on Windows. asio-sys downloads Steinberg's ASIO SDK during the build.
    name: ASIO build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bodo-kit-device --features asio --locked

  devices:
    # Real audio I/O through a virtual sound card: VB-CABLE on Windows, a PipeWire null sink on Linux. PipeWire is
    # what current Linux desktops run; PulseAudio's null sink stalls cpal's ALSA backend, so it is not used here.
    name: Audio devices (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        name: Start PipeWire with a virtual output
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pipewire pipewire-alsa pipewire-pulse wireplumber pulseaudio-utils
          systemctl --user daemon-reload
          systemctl --user start pipewire.socket pipewire-pulse.socket wireplumber.service
          systemctl --user start pipewire.service pipewire-pulse.service
          sleep 2
          pactl load-module module-null-sink sink_name=bodo_null
          pactl set-default-sink bodo_null
          pactl info
      - if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bodo-kit-device --release --locked -- --ignored --nocapture --test-threads=1 --skip exclusive
      - if: runner.os == 'Windows'
        # VB-CABLE's clock ticks every 10 to 16 ms whatever the buffer size, so exclusive mode is checked at a buffer
        # it can keep up with. Real sound cards keep up at their shortest period.
        run: cargo test -p bodo-kit-device --release --locked --test device -- --ignored --nocapture exclusive
        env:
          BODO_TEST_BUFFER: 1024
