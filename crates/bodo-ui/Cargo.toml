bodo-kit-audio.workspace = true
bodo-kit-core.workspace = true
bodo-kit-device.workspace = true
bodo-kit-music.workspace = true
bodo-kit-ui.workspace = true
bodo-mix.workspace = true
bodo-model.workspace = true
craft-ui.workspace = true
directories.workspace = true
egui.workspace = true
image.workspace = true
imbl.workspace = true
memory-stats.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }

