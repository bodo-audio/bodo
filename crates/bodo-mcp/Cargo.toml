[package]
name = "bodo-mcp"
description = "Bodo's MCP server: the command registry as tools, text-first inspection, and tools that drive the running app."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bodo-engine.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-std"] }
tracing.workspace = true

[dev-dependencies]
bodo-io.workspace = true
insta.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "macros"] }

[lints]
workspace = true
