[package]
name = "bodo-kit-dsp"
description = "DSP building blocks for Bodo Kit: gain, pan, smoothing, delay lines, filters, envelopes and buffers."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Serialize parameter types with serde.
serde = ["dep:serde", "bodo-kit-core/serde"]

[dependencies]
bodo-kit-core.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc = { workspace = true, features = ["warn_debug"] }
proptest.workspace = true

[lints]
workspace = true
