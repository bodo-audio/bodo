# License policy for Bodo Kit, run by `cargo xtask deny` with every non-Kit workspace crate excluded.
#
# Kit is MIT OR Apache-2.0, so its dependencies may use only permissive licenses or MPL-2.0, whose copyleft
# stays at the file level (project.md section 3.1, ADR 0002). Bans, advisories and sources are checked by the
# workspace policy in the repository's deny.toml.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
# The allow lists are policy, so a license nobody uses yet is not worth a warning.
unused-allowed-license = "allow"
allow = [
    # Permissive
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # File-level copyleft
    "MPL-2.0",
]
exceptions = [
    # egui's bundled fonts (Ubuntu Light, Noto Emoji), which Kit uses only in tests: bodo-kit-ui builds egui
    # without them. Font licenses cover the font data, not code that uses it.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
