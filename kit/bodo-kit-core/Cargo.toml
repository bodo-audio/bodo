[package]
name = "bodo-kit-core"
description = "Time units, tempo math and real-time primitives for Bodo Kit."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Serialize the time units and the tempo map with serde.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
