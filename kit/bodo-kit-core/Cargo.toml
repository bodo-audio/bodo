[package]
name = "bodo-kit-core"
description = "Time units, tempo math and real-time primitives for Bodo Kit."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Serialize the time units and the tempo map with serde.
serde = ["dep:serde"]

[dependencies]
assert_no_alloc.workspace = true
audio_thread_priority.workspace = true
bodo-kit-macros.workspace = true
no_denormals.workspace = true
rtrb.workspace = true
rtsan-standalone.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_no_alloc = { workspace = true, features = ["warn_debug"] }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
